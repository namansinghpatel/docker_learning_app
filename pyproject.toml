[project]
name = "docker-learning-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naman Singh", email = "namansinghpatel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

# Split by service so each one can be installed - and containerized - on its own.
# Local full-stack dev:  uv sync --all-extras
# Backend only:          uv sync --extra backend
# GUI only:              uv sync --extra gui
[project.optional-dependencies]
backend = [
    "fastapi>=0.141.1",
    "psycopg>=3.3.4",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]
gui = [
    "pyside6>=6.11.2",
    "requests>=2.34.2",
]

[project.scripts]
docker-learning-app = "docker_learning_app:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
