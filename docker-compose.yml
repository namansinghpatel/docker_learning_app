services:
  db:
    image: postgres:16-alpine
    container_name: docker_learning_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # HOST_PORT:CONTAINER_PORT — only the host side needs to differ if you're
      # also running Postgres natively on 5432. Internal container port stays 5432
      # regardless (that's what "backend" always connects to via POSTGRES_HOST=db).
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docker_learning_backend
    restart: unless-stopped
    environment:
      # Inside the Docker network, the DB is reachable by service name, not localhost
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Same idea: only the host side needs to change if 8000 is already taken
      # by a natively-running `uvicorn backend.main:app`. The GUI container talks
      # to `http://backend:8000` internally either way — unaffected by this.
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  gui:
    build:
      context: .
      dockerfile: gui/Dockerfile
    container_name: docker_learning_gui
    environment:
      BACKEND_URL: http://backend:8000
      DISPLAY: ${DISPLAY}
    volumes:
      # X11 socket - lets the container draw a window on the host's Linux display
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge
